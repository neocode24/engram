<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-title" content="Pin">
<script>
      const theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
</script>
<style>
/* 색은 블로그 src/styles/global.css의 @theme 값을 그대로 옮겼다. 고정 색(hex, rgb)은 쓰지 않고 pin이 더한 색도 없다. 상태 색은 text-secondary, accent(알파 단계), warn, danger 안에서만 고른다. */
:root{

--color-accent:oklch(0.54 0.18 250);--color-accent-hover:oklch(0.5 0.2 250);--color-border:oklch(0.905 0.006 85);--color-code-bg:oklch(0.945 0.006 85);
--color-dark-bg:oklch(0.21 0.015 260);--color-dark-bg-secondary:oklch(0.26 0.015 260);--color-dark-text:oklch(0.9 0.01 260);--color-dark-text-secondary:oklch(0.68 0.012 260);
--color-dark-accent:oklch(0.7 0.15 250);--color-dark-accent-hover:oklch(0.75 0.17 250);--color-dark-border:oklch(0.36 0.015 260);--color-dark-code-bg:oklch(0.28 0.015 260);
--color-warn:oklch(0.62 0.14 60);--color-danger:oklch(0.58 0.19 25);--color-dark-warn:oklch(0.78 0.14 60);--color-dark-danger:oklch(0.72 0.17 25)}
/* 화면 안에서는 이름이 짧은 별칭만 쓴다. 테마는 html.dark 하나로 바뀐다. */
:root{--bg:var(--color-bg);--bg2:var(--color-bg-secondary);--tx:var(--color-text);--tx2:var(--color-text-secondary);--ac:var(--color-accent);--ac-h:var(--color-accent-hover);--bd:var(--color-border);--code:var(--color-code-bg);
--warn:var(--color-warn);--danger:var(--color-danger);
--bd2:color-mix(in oklab,var(--tx2) 35%,var(--bd));
/* 강조색은 블로그처럼 그대로 쓴다. 대비가 모자라면 같은 색상각(250, 60, 25)의 명도(l)만 낮춘 고정 값을 쓴다. 본문 글자색(hue 90)을 섞으면 oklch 보간이 색상각을 틀어 청록이 된다.
   --ac-fill은 단추 바탕(블로그 .cf-period-btn.active와 같은 accent 그대로, 글자는 --bg) */
--ac-ink:oklch(0.46 0.18 250);--ac-fill:var(--color-accent);--warn-ink:oklch(0.46 0.12 60);--danger-ink:oklch(0.5 0.19 25);
--src-rem:oklch(0.55 0.16 300);--src-rem-ink:oklch(0.47 0.16 300);
--shadow:0 2px 8px rgba(0,0,0,.06);color-scheme:light}
html.dark{--bg:var(--color-dark-bg);--bg2:var(--color-dark-bg-secondary);--tx:var(--color-dark-text);--tx2:var(--color-dark-text-secondary);--ac:var(--color-dark-accent);--ac-h:var(--color-dark-accent-hover);--bd:var(--color-dark-border);--code:var(--color-dark-code-bg);
--warn:var(--color-dark-warn);--danger:var(--color-dark-danger);
--ac-ink:var(--ac);--ac-fill:var(--color-dark-accent);--warn-ink:oklch(0.80 0.10 65);--danger-ink:oklch(0.76 0.12 25);
--src-rem:oklch(0.72 0.13 300);--src-rem-ink:oklch(0.72 0.13 300);

*{box-sizing:border-box}
:root{--hh:calc(2.4rem + 25px)}  /* 1024px 이상 머리 높이: 제목 한 줄(1.5rem x 줄 높이 1.6) + 위아래 여백 24px + 밑줄 1px. 머리와 왼쪽 목록의 sticky top이 이 값 하나를 쓴다 */
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background-color:var(--bg);color:var(--tx);scroll-behavior:smooth}

code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere;word-break:break-all}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.node:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* 가로폭은 블로그 BaseLayout의 wide(최대 80rem, 좌우 1rem)와 .cf-dashboard(최대 1200px, 세로 간격 20px) 두 겹이다 */
.pw{max-width:80rem;margin:0 auto;padding:0 1rem}
main.pw{padding-top:2rem;padding-bottom:5rem}
.cf-dashboard{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
header{background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.hin{max-width:1200px;margin:0 auto}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:12px}
.ttl{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;min-width:0}
.cf-title{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--tx)}.cf-title span{color:var(--ac)}
/* 제목 앞 압정 아이콘: 높이는 제목 줄 높이 전체(1lh)이고 위아래 끝이 h1 상자와 같다. 바탕은 Pin 글자와 같은 --ac-fill, 모서리는 아이폰 홈 아이콘 비율(22%), 압정 모양은 홈 화면 아이콘 시안(apple-touch-icon)과 같다 */
.pinic{display:inline-block;vertical-align:top;width:1lh;height:1lh;margin-right:7px;flex:none}.pinic>rect{fill:var(--ac-fill)}.pinic g{fill:white}
.gen{color:var(--tx2);font-size:.75rem}.gen.stuck{color:var(--danger-ink);font-weight:700}
/* 'N분 전 반영'은 눌러서 새로 고치는 단추다. 겉모양은 글자 그대로이고 눌리는 자리만 위아래 6px, 좌우 4px 넓힌다(여백은 음수 margin으로 되돌려 줄 높이와 글자 자리는 그대로) */
button.gen{background:none;border:0;padding:6px 4px;margin:-6px -4px;border-radius:4px;text-align:right;cursor:pointer}
/* 로그인 만료 배너는 #view 밖에 둔다. 입력 중에는 #view를 다시 그리지 않아도 보이게 하려는 것이다 */
#authbar{margin-bottom:20px;border-radius:10px;padding:10px 14px;font-size:.875rem;color:var(--tx);border:1px solid color-mix(in oklab,var(--danger) 45%,var(--bd));background:color-mix(in oklab,var(--danger) 10%,var(--bg))}#authbar[hidden]{display:none}
#authbar b{color:var(--danger-ink)}#authbar .row2{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
#authbar button{border:1px solid var(--bd2);background:var(--bg);border-radius:6px;padding:4px 11px;font-size:.8125rem;min-height:32px;flex:none}#authbar button:hover{border-color:var(--ac);background:color-mix(in oklab,var(--ac) 8%,var(--bg))}
/* 당겨서 새로 고침(터치 기기: (pointer:coarse) 또는 (hover:none), 폭과 무관): 당기는 동안 머리 줄(header)과 본문(main)이 손가락을 따라 내려오고(스크립트가 transform을 건다) 위에 생긴 빈자리에 #ptr 알약을 둔다.
   고정 요소(#ptr, #drawer, #scrim, #confirm)는 header, main 밖에 있어 transform 영향을 받지 않는다. 쉴 때는 transform을 지운다(main에 transform이 남으면 본문 안 z-index 20 창이 머리 아래로 깔린다) */
#ptr{position:fixed;top:0;left:50%;z-index:6;transform:translate(-50%,0);opacity:0;visibility:hidden;pointer-events:none;background:var(--bg);color:var(--tx2);border:1px solid var(--bd2);border-radius:999px;padding:4px 12px;font-size:.75rem;white-space:nowrap;box-shadow:var(--shadow);display:none;transition:opacity .12s,visibility 0s linear .12s}
#ptr.on{visibility:visible;transition:opacity .12s}#ptr.ready{color:var(--ac-ink);border-color:var(--ac)}
html.pl-t header,html.pl-t main,html.pl-t #ptr.on{transition:transform .2s ease-out,opacity .12s}
@media (pointer:coarse),(hover:none){html,body{overscroll-behavior-y:contain}#ptr{display:block}}
@media (prefers-reduced-motion:reduce){#ptr,#ptr.on,html.pl-t header,html.pl-t main,html.pl-t #ptr.on{transition:none}}
.theme{background:none;border:0;padding:6px;border-radius:6px;color:var(--tx2);display:inline-flex;flex:none;min-width:32px;min-height:32px;align-items:center;justify-content:center}
.theme:hover{background:var(--bg2)}
.theme .sun{display:none}.theme .moon{display:block}html.dark .theme .sun{display:block}html.dark .theme .moon{display:none}
/* 누르는 것(서브 메뉴, 답 단추, 상태 단추)은 거의 직사각형(radius 6px)에 테두리와 hover가 있다. 위쪽 탭만 블로그 메뉴처럼 글자만 둔다. 보여 주기만 하는 것(칩, 라벨)은 둥근 타원에 테두리가 없다 */
/* 위쪽 탭: 블로그 헤더 메뉴(Blog, Quiz, About)처럼 글자만 둔다. 현재 탭은 굵게와 글자 아래 2px accent 밑줄(::after, 모든 탭이 투명 2px 자리를 갖는다).
   굵게 바뀔 때 폭이 달라져 옆 탭이 밀리지 않게 ::before가 굵은 글자 폭을 늘 잡아 둔다(data-label) */
nav{display:flex;gap:0;overflow-x:auto;margin-top:14px;padding:0 0 8px;position:relative}
nav button{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:0;border-radius:0;padding:4px 6px;min-height:32px;color:var(--tx2);white-space:nowrap;font-size:.875rem;flex:none;transition:color .15s}
nav button:before{content:attr(data-label);font-weight:600;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
nav button:after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2px;background:transparent}
nav button:hover{color:var(--ac)}
nav button.on,nav button.on:hover{color:var(--tx);font-weight:600}
nav button.on:after{background:var(--ac)}
/* 섹션 제목과 보조 문구: 블로그 .cf-section-title, .cf-section-sublabel */
h2{scroll-margin-top:130px;font-size:.875rem;font-weight:600;color:var(--tx);margin:0 0 -10px 2px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
h2 small{font-size:.6875rem;font-weight:400;color:var(--tx2)}
.cf-note{font-size:.75rem;color:var(--tx2);margin:6px 0 0}
/* 카드: 블로그 .cf-card(바탕 --color-bg, 테두리 1px, radius 10px, padding 20px)와 .cf-stat-card(14px 12px, gap 4px) */
.cf-card,.card,.row,.mapbox{background:var(--bg);border:1px solid var(--bd);border-radius:10px;min-width:0;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.cf-card{padding:20px}
.cf-card:hover,.row:hover,.card.go:hover{box-shadow:var(--shadow);border-color:color-mix(in oklab,var(--ac) 55%,transparent)}
/* 카드 전체를 눌러 첫 항목의 상세를 연다(포인터용). 열 항목이 없는 카드는 .go가 없어 커서도 hover 표시도 없다. 카드는 단추가 아니라 모서리는 10px 그대로다. 키보드와 화면 낭독기는 번호 링크로 연다 */
.card.go{cursor:pointer}
/* 숫자 카드는 블로그 .cf-stat-card보다 촘촘하다: 이름은 작게, 숫자는 크게, 가운데 정렬 */
.cf-stat-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;overflow:hidden;min-width:0;transition:box-shadow .15s,border-color .15s}
.cf-stat-card:hover{box-shadow:var(--shadow);border-color:color-mix(in oklab,var(--ac) 55%,transparent)}
.cf-stat-label{font-size:.6875rem;font-weight:500;line-height:1.3;color:var(--tx2)}
.cf-stat-value{font-size:1.25rem;font-weight:700;line-height:1.25;color:var(--tx)}
.cf-stat-card.zero .cf-stat-label,.cf-stat-card.zero .cf-stat-value{color:var(--tx2)}
.cf-card-title{font-size:.875rem;font-weight:600;color:var(--tx);margin:0 0 16px;letter-spacing:-.01em}
.cf-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
/* 오늘 탭 요약: 휴대폰은 한 행 둘, 768px부터 한 행 넷. 누르면 그 절로 가는 카드는 button이지만 모양은 숫자 카드(10px)다 */
/* 오늘 탭 요약: 카드 여섯. 1024px 이상은 한 줄 `이번 주 | 열린 일 묶음 | 중단 일 묶음 | 기한 지남`(1fr 2fr 2fr 1fr)이고 묶음마다 두 카드 위에 양 끝이 아래로 꺾인 얇은 선 가운데 글자(.sg-h)를 얹는다.
   1023px 이하는 두 칸씩: 이번 주와 기한 지남이 첫 줄, 열린 일 묶음, 중단 일 묶음 순(화면 순서만 order로 바꾸고 DOM 순서는 이번 주, 할 일, 진행 중, 대기, 보류, 기한 지남) */
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.sumgrid .sg{grid-column:1/-1;min-width:0}
.sumgrid .one{min-width:0}.sumgrid .one.week{order:0}.sumgrid .one.late{order:1}.sumgrid .sg.open{order:2}.sumgrid .sg.stop{order:3}
.sg-c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sg-h{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.6875rem;font-weight:600;color:var(--tx2);letter-spacing:.02em}  /* 글자 크기와 색은 왼쪽 목록 머리 .pn-h와 같다 */
.sg-n{font-weight:400}
.sg-h:before,.sg-h:after{content:'';flex:1;height:6px;margin-top:6px;border-top:1px solid var(--bd2)}
.sg-h:before{border-left:1px solid var(--bd2);border-top-left-radius:4px}
.sg-h:after{border-right:1px solid var(--bd2);border-top-right-radius:4px}
/* 카드를 골라 오늘 탭 안에서 그 일만 보는 머리 */
.pick-h{display:flex;align-items:baseline;gap:8px;margin:4px 2px 10px;font-size:1rem;font-weight:700}
.pick-h .fc{font-size:1rem;font-weight:400;color:var(--tx2)}
.pick-x{margin-left:auto;font:inherit;font-size:.8125rem;font-weight:400;color:var(--tx2);background:none;border:0;border-bottom:1px dashed var(--bd2);padding:0;cursor:pointer}
.pick-x:hover{color:var(--tx)}
button.cf-stat-card{font:inherit;color:inherit;width:100%;cursor:default}
button.cf-stat-card.go{cursor:pointer}
button.cf-stat-card.go:hover{border-color:var(--ac);box-shadow:var(--shadow)}
button.cf-stat-card.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}  /* 오늘 탭에서 골라 아래 목록을 바꾼 카드 */
/* 요약 카드 테두리는 늘 일반 --bd다. 색은 기한 카드의 숫자에만 있다(이번 주 주황, 기한 지난 일 빨강). 보류 숫자는 기본 글자색 */
.cf-stat-card.tone-danger .cf-stat-value{color:var(--danger-ink)}
.cf-stat-card.tone-warn .cf-stat-value{color:var(--warn-ink)}
.cf-stat-card.zero .cf-stat-value{font-weight:500}
.ws-top{display:grid;grid-template-columns:1fr;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}

/* 카드 한 장: 위쪽 줄(왼쪽 meta, 오른쪽 출처 라벨), 제목, 아래쪽 줄(오른쪽 끝 상태 라벨). 데스크톱은 한 행에 둘 */
.cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.card{padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;color:inherit}
.card .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .ctop .meta{min-width:0;flex:1}.card .ctop>.chip,.card .ctop>.kind{flex:none}
/* 반영 대기 칩은 출처 라벨 바로 왼쪽에 놓인다(.cright). 칩이 있는 카드의 위 줄(.ctop.hasp)이 좁으면 칩과 출처 라벨이 함께 아래 줄로 내려가 오른쪽 정렬이 되고, 출처 라벨은 늘 맨 오른쪽이다 */
.card .ctop>.cright{flex:none;max-width:100%;margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px 6px}
.card .ctop.hasp{flex-wrap:wrap}.card .ctop.hasp .meta{flex:1 1 auto}
.tagc{font-size:.75rem;color:var(--tx2)}
.card .t{font-weight:650;font-size:.9375rem;line-height:1.4;margin:0}
.card .sub{font-size:.8125rem;color:var(--tx2)}
.card p{margin:0;color:var(--tx2);font-size:.875rem}
.card .foot{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;flex-wrap:wrap;margin-top:auto}
.banner{border-radius:10px;padding:10px 14px;font-size:.875rem;border:1px solid var(--bd);background:var(--bg)}
.banner.warn{--tn:var(--danger);--tn-ink:var(--danger-ink);background:color-mix(in oklab,var(--danger) 10%,var(--bg));border-color:color-mix(in oklab,var(--danger) 45%,var(--bd));color:var(--tx)}
.banner.info{--tn:var(--ac);--tn-ink:var(--ac-ink);background:color-mix(in oklab,var(--ac) 10%,var(--bg));border-color:color-mix(in oklab,var(--ac) 45%,var(--bd));color:var(--tx)}
.banner b{color:var(--tn-ink)}
.banner .row2{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.banner ul{margin:4px 0 0;padding-left:18px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--tx2)}
.id{font:600 12px ui-monospace,Menlo,monospace;color:var(--tx2)}
/* 라벨(칩): 보여 주기만 한다. 원칙은 파랑은 일의 상태에만, 주황과 빨강은 시간(기한)에만 쓴다. 종류는 색이 아니라 모양으로 나눈다.
   상태 칩 = --bg2 바탕 타원 + 앞 점, 기한 칩 = 테두리 사각(5px), 관계 라벨 = 회색 테두리 사각, 반영 대기 = 점선 테두리. 현황 신호(.sig)는 기한에서 나온 값이라 주황, 빨강을 그대로 쓴다.
   예외는 출처 라벨 `미리알림` 하나로, 기한 칩(warn 60)과 겹쳐 보이지 않게 보라(300, --src-rem)를 쓴다 */

.chip.s-ok{color:var(--tx2)}.chip.s-ok:before{background:color-mix(in oklab,var(--ac) 45%,var(--bg))}

/* 출처 라벨: 테두리만 있는 타원. 배경은 투명하고 테두리와 글자가 출처 색이다(상태 라벨은 옅은 배경을 채운 타원이라 겹쳐 읽히지 않는다). 글자는 같은 색상각에서 명도만 낮춘 ink */

.newbox{display:flex;flex-direction:column;gap:6px;margin-top:2px}.newbox .hint{font-size:.8125rem}.newbox .nrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.newbox input{border:1px solid var(--bd2);border-radius:6px;padding:4px 9px;background:var(--bg);min-width:0;width:100%;min-height:32px}

/* 고르기 목록(select)은 입력 칸과 높이, 테두리, 모서리, 글자 크기를 같게 맞춘다. 기본 모양(iOS Safari 포함)을 걷어내고 화살표는 CSS 그라데이션 두 장으로 그린다. CSP가 img-src 'none'이라 이미지 주소 배경(data URI 포함)은 쓸 수 없다 */

<script>
(function(){
'use strict';
// pin:config begin
// 이 구역의 값만 사이트마다 다르다. engram 하네스가 표시 문자열로 구역을 찾아 값을 바꾼다. 표시는 파일에 한 번씩만 둔다.
// API: 상태와 변경 요청을 주고받는 경로. SOURCES: 이 사이트가 쓰는 출처(reminder가 없으면 미리알림 탭을 내지 않는다). AUTH: 'access'는 앞단 로그인이 있다(연결 실패를 로그인 만료로 읽는다), 'none'은 로그인이 없다(연결 실패를 그대로 보이고 다시 불러오지 않는다).
var API='/pin/api/', SOURCES=['wiki'], AUTH='none';
// pin:config end
// 상태의 글은 모두 textContent로만 넣는다. innerHTML, 외부 스크립트, 외부 글꼴, 이미지를 쓰지 않는다.
var POLL_MS=60000, FAST_MS=10000, FAST_MAX_MS=10*60*1000, STUCK_MS=30*60*1000, GIVE_UP_MS=60*60*1000, MAX_NAME=60, MAX_DESC=200;
var STATUSES=['todo','doing','waiting','hold','done'];
var STATUS_CLASS={todo:'s-todo',doing:'s-run',waiting:'s-wait',hold:'s-hold',done:'s-ok'};
var STATUS_LABEL={todo:'할 일',doing:'진행 중',waiting:'대기',hold:'보류',done:'완료'};
var WAIT_REASONS=[['prior','선행'],['reply','회신'],['decision','결정']];
var ASK_LABEL={accept:'맞음',reject:'아님',touch:'아직 진행 중',done:'끝남',hold:'보류',owner_me:'나',owner_other:'상대',owner_unknown:'모름',attach:'기존 프로젝트에 붙이기',new:'새 프로젝트로 만들기',none:'프로젝트 아님'};
var TABS=[['today','오늘'],['works','프로젝트별 현황'],['map','연관 지도'],['items','할 일'],['rem','미리알림']].filter(function(t){return t[0]!=='rem'||SOURCES.indexOf('reminder')>=0});

var S=null, PEND=[], LOCAL=load('pin.local'), NOTES=load('pin.notes'), loadError=null, authExpired=false, refreshing=false, actionError=null, busy=false;
var tab='today', sub='all', todayWork='all', todayOwner='all', todayPick=null, mapWork='all', mapOwner='all', F={work:'all',owner:'all',status:'all'}, sel=null, openId=null, stFlow=null, ownerAsk=null, clsAsk=null, lastOpener=null, wkNew=null, dueFlow=null, titleFlow=null, relFlow=null;
var MAX_NOTE=500;
var delAsk=null, DEL_WATCH={}, JUST_DELETED=[];  // delAsk: 삭제 확인 창({id, rev, opener}). DEL_WATCH: 삭제를 보낸(또는 미리알림에서 지우는 중인) 항목 id -> 제목. 상태에서 사라지면 `지웠습니다`를 한 번 보인다
// 휴대폰(639px 이하)의 바텀 시트. CSS 경계와 같은 값이다.
var SHEET_MQ=window.matchMedia('(max-width:639px)'), REDUCE_MQ=window.matchMedia('(prefers-reduced-motion:reduce)');
var drag=null, lockY=null, keepTimer=null, snapTimer=null;

// 탭마다 하나. 같은 화면이 연달아 보낸 변경은 서로 충돌이 아니라고 원장이 알아보게 모든 요청에 싣는다.
var CLIENT=clientId();
function clientId(){
  try{var v=sessionStorage.getItem('pin.client');if(v&&/^[A-Za-z0-9_-]{8,64}$/.test(v))return v}catch(e){/* sessionStorage를 못 쓰면 이번 로드에서만 쓴다 */}
  var a=new Uint8Array(16);crypto.getRandomValues(a);
  var id=Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  try{sessionStorage.setItem('pin.client',id)}catch(e){/* 위와 같다 */}
  return id}
function load(key){try{var v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function save(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(e){/* 저장 못 해도 화면은 동작한다 */}}

function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){var v=attrs[k];
    if(v===null||v===undefined||v===false)return;
    if(k==='class')e.className=v;
    else if(k.indexOf('on:')===0)e.addEventListener(k.slice(3),v);
    else e.setAttribute(k,v===true?'':v)});
  add(e,Array.prototype.slice.call(arguments,2));return e}
function add(e,kids){kids.forEach(function(k){
  if(k===null||k===undefined||k===false)return;
  if(Array.isArray(k))add(e,k);else if(k instanceof Node)e.appendChild(k);else e.appendChild(document.createTextNode(String(k)))})}
var NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){var e=document.createElementNS(NS,tag);
  if(attrs)Object.keys(attrs).forEach(function(k){var v=attrs[k];if(k.indexOf('on:')===0)e.addEventListener(k.slice(3),v);else if(v!==null&&v!==undefined)e.setAttribute(k,v)});
  add(e,Array.prototype.slice.call(arguments,2));return e}

var IT={}, WORK={};
function index(){IT={};WORK={};if(!S)return;S.items.forEach(function(i){IT[i.id]=i;if(i.reminder&&i.reminder.write_pending==='delete')watchDelete(i)});S.works.forEach(function(w){WORK[w.id]=w})}
function workName(id){return WORK[id]?WORK[id].name:'미분류'}
function isOpen(i){return i.status!=='done'}
// 날짜 문자열만으로 요일과 이번 주 끝(일요일)을 계산한다. 브라우저 시간대에 기대지 않는다(UTC 자정으로만 계산해 하루 밀리지 않는다)
var DOW='일월화수목금토';
function utcOf(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function dowOf(s){var u=utcOf(s);return u?DOW.charAt(u.getUTCDay()):''}
function weekEndOf(s){var u=utcOf(s);if(!u)return null;return new Date(u.getTime()+((7-u.getUTCDay())%7)*864e5).toISOString().slice(0,10)}
function isMine(i){return i.owner.who==='me'||i.owner.who==='unknown'}

// 화면에 나가는 날짜는 모두 이 함수를 거친다. 올해(상태 파일 generated_at의 연도, 브라우저 시계가 아니다)는 11/18, 다른 해는 2025/12/30. 날짜가 아닌 값은 그대로 둔다.
function dfmt(x){
  var m=typeof x==='string'?/^(\d{4})-(\d{2})-(\d{2})/.exec(x):null;
  if(!m)return typeof x==='string'?x:'';
  var yr=S&&typeof S.generated_at==='string'?S.generated_at.slice(0,4):'';
  return (m[1]===yr?'':m[1]+'/')+m[2]+'/'+m[3]}
// 상태 파일이 문장 안에 박아 보낸 YYYY-MM-DD(예: 질문 이유의 `마지막 기록 2026-11-04(위키)`)도 화면에서만 바꾼다. 문서에서 가져온 인용문(quote)은 원문이라 건드리지 않는다
// 경로나 파일 이름의 일부(앞에 / . - 글자가 붙거나 뒤에 - 글자가 이어지는 날짜)는 바꾸지 않는다
function dtext(t){return typeof t==='string'?t.replace(/(?<![\w\/.-])(\d{4})-(\d{2})-(\d{2})(?![\w-])/g,function(m){return dfmt(m)}):t}
function ago(ms){
  var m=Math.floor(ms/60000);
  if(m<1)return '방금';if(m<60)return m+'분 전';
  var hh=Math.floor(m/60);if(hh<24)return hh+'시간 전';
  return Math.floor(hh/24)+'일 전'}
function recordText(i){return i.days_since_record===null||i.days_since_record===undefined?'마지막 기록 없음':'마지막 기록 '+i.days_since_record+'일 전'}

// ---- 반영 대기 ----
function doneIds(){var s={};(S?S.recent_changes:[]).forEach(function(r){s[r.id]=true});return s}
function pending(){
  var done=doneIds(), seen={}, out=[];
  PEND.concat(LOCAL).forEach(function(c){if(c&&c.id&&!done[c.id]&&!seen[c.id]){seen[c.id]=true;out.push(c)}});
  return out}
function pendingFor(id){return pending().filter(function(c){return c.item===id})}
// 칸마다 그 항목의 반영 대기 요청 가운데 마지막 것. 있으면 그 칸은 보낸 값으로 미리 보이고 잠긴다. 반영이 확인되거나(pending에서 빠짐) 거절되거나 오래 남아 포기하면 저절로 풀린다
function pendOp(i,ops){
  var list=pendingFor(i.id).filter(function(c){return ops.indexOf(c.op)>=0});
  return list.length?list[list.length-1]:null}
function stuck(){
  var p=pending();if(!p.length)return false;
  var oldest=Math.min.apply(null,p.map(function(c){var t=Date.parse(c.at);return isNaN(t)?Date.now():t}));
  return Date.now()-oldest>STUCK_MS}
function settleLocal(){
  if(!S)return;
  var byId={};S.recent_changes.forEach(function(r){byId[r.id]=r});
  var keep=[],changed=false;

function inWeek(i,today,end){return !!(i.due&&today&&end&&i.due.date>=today&&i.due.date<=end)}
// 상태 단추로 표현되지 않는 조건 둘(이번 주 해야 할 일, 기한 지난 일). 완료가 아닌 일만 센다
function condOk(i,c){
  if(!isOpen(i))return false;
  if(c==='week')return inWeek(i,S.today,weekEndOf(S.today));
  return !!(i.due&&i.due.days_left<0)}
function toItems(work,owner){goTab('items',function(){F.status='all';F.work=work;F.owner=owner})}
function dueSort(a,b){  // 기한이 가까운 순, 기한이 없으면 뒤, 같으면 번호순
  var x=a.due&&a.due.date,y=b.due&&b.due.date;
  if(x&&y&&x!==y)return x<y?-1:1;
  if(x&&!y)return -1;if(!x&&y)return 1;
  return a.id<b.id?-1:a.id>b.id?1:0}
// 새로 추가된 일(원장 unseen): 열린 일 가운데 사람이 아직 열어 보지 않은 것. 확인이 필요한 일 카드에 걸린 항목과 확인을 보낸 항목(반영 대기)은 뺀다
var NODUE_ORDER=['doing','todo','hold'];
function newItems(){
  var onAsk={};S.asks.forEach(function(a){(a.items||[]).forEach(function(id){onAsk[id]=true})});
  return S.items.filter(function(i){return i.unseen===true&&isOpen(i)&&!onAsk[i.id]&&!seenSent(i.id)}).sort(function(a,b){return a.id<b.id?1:a.id>b.id?-1:0})}
function vToday(){
  var cur=todayWorkOk(todayWork)?todayWork:'all', ownerCur=todayOwnerOk(todayOwner)?todayOwner:'all';
  var live=S.items.filter(function(i){return isOpen(i)&&inScope(i,cur,ownerCur)});  // 완료가 아닌 일. 요약 카드와 아래 절의 재료다
  var of=function(st){return live.filter(function(i){return i.status===st})};
  var by={prior:[],reply:[],decision:[]};
  live.forEach(function(i){if(i.status==='waiting'&&i.wait&&by[i.wait.reason])by[i.wait.reason].push(i)});
  var week=live.filter(function(i){return condOk(i,'week')}).sort(function(a,b){return a.due.date<b.due.date?-1:a.due.date>b.due.date?1:0});
  var late=live.filter(function(i){return condOk(i,'late')});
  // 요약 카드 여섯: 이번 주, 할 일, 진행 중, 대기, 보류, 기한 지남. 열린 일 = 할 일 + 진행 중, 중단 일 = 대기 + 보류
  var L={week:{label:'이번 주 해야 할 일',list:week,tone:'warn'},todo:{label:'할 일',list:of('todo')},doing:{label:'진행 중',list:of('doing')},
    waiting:{label:'대기',list:of('waiting')},hold:{label:'보류',list:of('hold'),tone:'hold'},late:{label:'기한 지남',list:late,tone:'danger'}};
  if(!L[todayPick])todayPick=null;
  var card=function(k){var c=L[k];return {n:c.list.length,el:sumCard(c.label,c.list.length,{key:k,tone:c.tone,on:todayPick===k,go:function(){setTodayPick(todayPick===k?null:k)}})}};
  var cw=card('week'),ct=card('todo'),cd=card('doing'),cq=card('waiting'),ch=card('hold'),cl=card('late');
  var out=[h('div',{class:'sumgrid'},h('div',{class:'one week'},cw.el),sumGroup('open','열린 일',[ct,cd]),sumGroup('stop','중단 일',[cq,ch]),h('div',{class:'one late'},cl.el))];
  if(todayPick){  // 카드를 골랐으면 아래 절 대신 그 일만 본다
    var P=L[todayPick],ps=P.list.slice().sort(dueSort);
    out.push(h('section',{class:'pick','data-pick':todayPick},
      h('h2',{class:'pick-h'},h('span',null,P.label),h('span',{class:'fc'},ps.length+'건'),h('button',{type:'button',class:'pick-x','on:click':function(){setTodayPick(null)}},'오늘 화면으로')),
      ps.length?h('div',{class:'cards'},ps.map(function(i){return cardItem(i)})):h('div',{class:'empty'},'없습니다.')));
    return out}
  // 새로 추가된 일: 확인이 필요한 일에 걸린 항목은 그쪽에만 뜬다. 프로젝트와 담당으로 거르지 않는다(확인 절과 같다). 0건이면 절을 그리지 않는다
  var fresh=newItems();
  if(fresh.length)out.push(foldSec('new','sec-new','새로 추가된 일',fresh.length,'받은 뒤 아직 열어 보지 않은 일, 최근 것이 위',
    h('div',{class:'cards'},fresh.map(function(i){return cardItem(i)})),
    {hot:true,action:h('button',{type:'button',class:'sec-act','data-seen-all':'1','on:click':function(){sendSeen(fresh.map(function(i){return i.id}))}},'모두 확인')}));
  // 확인이 필요한 일은 프로젝트와 담당으로 거르지 않는다(걸렀으면 제목 옆에 알려 준다)
  out.push(foldSec('ask','sec-ask','확인이 필요한 일',S.asks.length,'Pin이 제안하고 이유를 붙였습니다. 확정은 직접 합니다',
    S.asks.length?h('div',{class:'cards'},S.asks.map(function(a){return askCard(a,'today')})):h('div',{class:'empty'},'확인할 것이 없습니다.'),
    {hot:true,extra:cur==='all'&&ownerCur==='all'?null:h('small',{class:'allproj'},cur!=='all'&&ownerCur!=='all'?'모든 프로젝트와 담당자':cur!=='all'?'모든 프로젝트':'모든 담당자')}));
  out.push(foldSec('late','sec-late','기한 지남',late.length,null,
    late.length?h('div',{class:'cards'},late.map(function(i){return cardItem(i)})):h('div',{class:'empty'},'없습니다.')));
  var freshIds={};fresh.forEach(function(i){freshIds[i.id]=true});
  var nodue=live.filter(function(i){return !i.due&&NODUE_ORDER.indexOf(i.status)>=0&&!freshIds[i.id]}).sort(function(a,b){  // 진행 중, 할 일, 보류 순. 같으면 번호순
    var x=NODUE_ORDER.indexOf(a.status),y=NODUE_ORDER.indexOf(b.status);return x!==y?x-y:a.id<b.id?-1:a.id>b.id?1:0});
  out.push(foldSec('nodue','sec-nodue','기한 없는 일',nodue.length,'기한을 정하지 않은 일',
    nodue.length?h('div',{class:'cards'},nodue.map(function(i){return cardItem(i)})):h('div',{class:'empty'},'없습니다.')));
  out.push(foldSec('week','sec-week','이번 주 해야 할 일',week.length,'기한이 오늘부터 일요일까지, 이른 순',
    week.length?h('div',{class:'cards'},week.map(function(i){return cardItem(i)})):h('div',{class:'empty'},'없습니다.')));
  out.push(waitBlock('prior','선행을 기다리는 일','앞선 일이 끝나야 시작합니다',by.prior,function(i){
    var on=i.wait.on&&IT[i.wait.on];
    return h('p',null,h('span',{class:'rel r-후행'},'후행'),' 먼저 끝나야 하는 일: ',h('b',null,i.wait.on?(i.wait.on+' '+(i.wait.on_title||(on?on.title:''))):'정해지지 않음'),on?' ('+on.status_label+')':'')},'sec-wait'));
  out.push(waitBlock('reply','회신을 기다리는 일','상대의 답을 기다립니다, 오래 기다린 순서',by.reply.slice().sort(function(a,b){return b.days_in_status-a.days_in_status}),function(i){
    return h('p',null,h('b',null,i.wait.on||i.owner.label),', '+i.days_in_status+'일째 ('+dfmt(i.since)+'부터)')}));
  out.push(waitBlock('decision','결정을 기다리는 일','먼저 정할 것이 정해져야 합니다',by.decision,function(i){
    return h('p',null,h('b',null,'먼저 정할 것'),' '+(i.wait.on||'적혀 있지 않습니다'))}));
  return out}

// ---- 차트: 외부 라이브러리 없이 SVG와 CSS로 그린다. 색은 블로그 cfColors()처럼 CSS 변수에서 읽고, 테마가 바뀌면 다시 그린다 ----
function tok(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function tokRgba(color,alpha){
  var cv=document.createElement('canvas');cv.width=cv.height=1;
  var ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle=color;ctx.fillRect(0,0,1,1);
  var d=ctx.getImageData(0,0,1,1).data;
  return 'rgba('+d[0]+','+d[1]+','+d[2]+','+alpha+')'}
function cfColors(){
  var accent=tok('--ac');
  var ramp=[0.3,0.45,0.6,0.75,0.9,1].map(function(a){return tokRgba(accent,a)});
  // 상태 색: 할 일은 text-secondary 알파, 진행 중은 accent, 대기는 warn, 보류는 danger, 완료는 옅은 accent 알파(블로그 accent 알파 단계 둘째)
  return {text:tok('--tx'),textSec:tok('--tx2'),border:tok('--bd'),accent:accent,warn:tok('--warn'),danger:tok('--danger'),
    todo:tokRgba(tok('--tx2'),0.55),done:ramp[1],wait:ramp[3],ramp:ramp}}
var STATUS_COLOR={todo:'todo',doing:'accent',waiting:'wait',hold:'textSec',done:'done'};

function countsOf(wid){
  var c={todo:0,doing:0,waiting:0,hold:0,done:0};
  S.items.forEach(function(i){if(!wid||i.work===wid)c[i.status]++});return c}
function openN(c){return c.todo+c.doing+c.waiting+c.hold}

// 원형(도넛): 블로그 정독률 도넛과 같은 크기 140, r 52, stroke 18. 조각마다 stroke-dasharray와 rotate(-90)
function donutChart(segs,big,label,sub,aria){
  var size=140,c=70,r=52,sw=18,C=2*Math.PI*r,col=cfColors();
  var total=segs.reduce(function(a,s){return a+s.v},0),acc=0;
  var svg=sv('svg',{width:size,height:size,viewBox:'0 0 140 140',class:'chart',role:'img','aria-label':aria});
  svg.appendChild(sv('circle',{cx:c,cy:c,r:r,fill:'none',stroke:col.border,'stroke-width':sw}));
  segs.forEach(function(s){
    if(!s.v||!total)return;
    var d=s.v/total*C;
    svg.appendChild(sv('circle',{cx:c,cy:c,r:r,fill:'none',stroke:col[s.color],'stroke-width':sw,'stroke-dasharray':d+' '+(C-d),'stroke-dashoffset':-acc,transform:'rotate(-90 '+c+' '+c+')'}));
    acc+=d});
  svg.appendChild(sv('text',{x:c,y:c-8,'text-anchor':'middle',class:'cf-donut-avg'},String(big)));
  svg.appendChild(sv('text',{x:c,y:c+8,'text-anchor':'middle',class:'cf-donut-label'},label));
  svg.appendChild(sv('text',{x:c,y:c+20,'text-anchor':'middle',class:'cf-donut-samples'},sub));
  return svg}

// 가로 막대: 블로그 .cf-gc-bar(배경 --color-bg-secondary) 안에 채움. 인라인 style은 CSP가 허용하지 않아 SVG 사각형으로 채운다
function hbarRow(name,val,max,color){
  var svg=sv('svg',{class:'cf-gc-bar',viewBox:'0 0 100 6',preserveAspectRatio:'none','aria-hidden':'true'},
    sv('rect',{x:0,y:0,width:max?Math.min(100,val/max*100):0,height:6,fill:color}));
  return h('div',{class:'cf-gc-row'},h('span',{class:'cf-gc-name',title:name},name),svg,h('span',{class:'cf-gc-pct'},String(val)))}

// 세로 막대: 블로그에는 원본이 없어(Chart.js) 같은 색 규칙으로 SVG 사각형을 직접 그린다
function vbarChart(days,aria){
  var W=240,H=120,top=16,bottom=18,base=H-bottom,n=days.length,step=(W-8)/n,bw=Math.max(4,step-6),col=cfColors();
  var max=Math.max(1,Math.max.apply(null,days.map(function(d){return d.count})));
  var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart vb',role:'img','aria-label':aria});
  svg.appendChild(sv('line',{x1:4,y1:base,x2:W-4,y2:base,stroke:col.border,'stroke-width':1}));
  days.forEach(function(d,k){
    var x=4+k*step+(step-bw)/2,ht=d.count?Math.max(3,d.count/max*(base-top)):0;
    if(d.count){
      svg.appendChild(sv('rect',{x:x,y:base-ht,width:bw,height:ht,rx:2,fill:col.ramp[5]}));
      svg.appendChild(sv('text',{x:x+bw/2,y:base-ht-3,'text-anchor':'middle',class:'vb-t'},String(d.count)))}
    else svg.appendChild(sv('rect',{x:x,y:base-1.5,width:bw,height:1.5,fill:col.border}))});
  [[0,'start'],[Math.floor((n-1)/2),'middle'],[n-1,'end']].forEach(function(p){
    var d=days[p[0]];if(!d)return;
    var x=p[1]==='start'?4:p[1]==='end'?W-4:4+p[0]*step+step/2;
    svg.appendChild(sv('text',{x:x,y:H-4,'text-anchor':p[1],class:'vb-t'},dfmt(d.date)))});
  return svg}

// own: 오늘, 연관 지도, 할 일 탭이 담당 거르기를 함께 넘긴다({kind: data 속성 이름, cur: 고른 담당, set: 값을 받는 함수}). 없으면 프로젝트 목록만 그린다(프로젝트별 현황)
// ---- 프로젝트 순서(왼쪽 목록) ----
// 순서의 원본은 원장 config.works의 배열 순서이고 상태 파일 works가 그 순서로 온다(미분류는 늘 맨 뒤). 순서를 바꾸면 set_work_order 요청 하나를 보내고,
// 반영이 확인될 때까지(반영 대기) 보낸 순서로 미리 그린다. 거절되면 상태 파일의 순서로 돌아가고 `반영 안 됨` 배너가 뜬다. 네 탭의 목록이 모두 같은 worksView()를 쓴다.
var ordHold=null, ordMode=null, ordDrag=null, ordSuppress=false;  // ordHold: 보내는 중인 순서. ordMode: 좁은 화면 순서 변경 모드({order}). ordDrag: 끌고 있는 줄. ordSuppress: 끌기가 끝난 직후 click을 한 번 버린다
function pendOrder(){
  if(ordHold)return ordHold;
  var l=pending().filter(function(c){return c.op==='set_work_order'&&c.args&&Array.isArray(c.args.order)});
  return l.length?l[l.length-1].args.order:null}
function orderedWorks(ws,o){
  var by={},out=[],tail=null;
  ws.forEach(function(w){if(w.id==='unsorted')tail=w;else by[w.id]=w});
  (o||[]).forEach(function(id){if(by[id]){out.push(by[id]);by[id]=null}});
  ws.forEach(function(w){if(w.id!=='unsorted'&&by[w.id])out.push(w)});  // 순서에 없는 프로젝트(그 사이 새로 생김)는 원래 자리 순서로 뒤에
  return tail?out.concat([tail]):out}
function worksView(){return orderedWorks(S.works,pendOrder())}
function orderIds(){return worksView().filter(function(w){return w.id!=='unsorted'}).map(function(w){return w.id})}
function sameList(a,b){return a.length===b.length&&a.every(function(x,k){return x===b[k]})}
function sendOrder(order){
  ordHold=order;actionError=null;render();
  return post({op:'set_work_order',args:{order:order}}).then(function(res){
    LOCAL.push({id:res.id,item:null,op:'set_work_order',args:{order:order},at:res.at||new Date().toISOString(),note:'프로젝트 순서'});save('pin.local',LOCAL)
  }).catch(function(e){actionError='프로젝트 순서를 보내지 못했습니다: '+e.message}).then(function(){if(ordHold===order)ordHold=null;render();refresh()})}
function ordChip(cls){return pendOrder()?h('div',{class:cls},h('span',{class:'chip pendchip',role:'status','data-order':'pending'},'반영 대기')):null}
// 1024px 이상: 줄을 끌어 옮긴다(마우스, 펜). 5px 넘게 움직여야 끌기이고 그 전의 누름은 줄 고르기다. 놓으면 새 순서로 바로 그리고 요청 하나를 보낸다
function ordRows(){return [].slice.call(document.querySelectorAll('.pn-side .pn-it.pn-mv'))}

// 다시 그려도 가로 스크롤 줄(위쪽 탭 줄, 프로젝트 서브 메뉴)의 위치와 서랍의 세로 위치를 지킨다. 지워서 다시 만들면 0으로 돌아가 고른 단추가 화면 밖에 남는다.

// 머리 줄의 'N분 전 반영' 단추와 로그인 만료 배너. render와 따로 부를 수 있다(입력 중에는 #view를 다시 그리지 않아도 이 둘은 바뀐다)

window.addEventListener('resize',fitMemo);
window.addEventListener('error',function(ev){var v=document.getElementById('view');if(v){v.textContent='화면 오류: '+(ev&&ev.message?ev.message:'오류')}});
document.getElementById('scrim').addEventListener('click',closeDrawer);
(function(){

// 지도 탭에서 선택한 상자가 있을 때 지도 밖의 빈 곳(화면 여백 포함)을 누르면 푼다. 단추, 링크, 입력 칸, 관계 목록 카드(번호 링크로 상세를 여는 동작과 겹치지 않게), 서랍, 지도 안(위 svg 처리기가 맡는다)과 글을 고른 상태는 건너뛴다.

// 로그인 만료 배너(#authbar)는 한 번 만들어 두고 paintHead가 보이고 감춘다. 누르면 페이지 전체를 다시 불러온다

  h('button',{type:'button','data-auth':'reload','on:click':hardReload},'다시 불러오기')));

// ---- 당겨서 새로 고침(터치 기기) ----
// 메인 화면이 맨 위(scrollY <= 0)일 때 아래로 PULL_PX 이상 당겼다 놓으면 새로 고친다(manualRefresh). 당기는 동안 머리 줄과 본문이 손가락 이동의 절반(최대 PULL_MAX)만큼 내려오고 위 빈자리에 #ptr 표시를 둔다.
// 문턱을 넘고 놓으면 PULL_HOLD 높이에서 '불러오는 중'으로 멈췄다가 읽기가 끝나면 올라간다. 문턱 전에 놓으면 바로 올라간다. 올라가는 움직임은 prefers-reduced-motion이면 없다.
// 서랍과 확인 창이 열려 있거나 순서 변경 모드, 시트 끌기, 입력 중, 지도 상자(.mapbox)와 입력 칸에서 시작한 손가락은 건드리지 않는다. 가로로 먼저 움직이면 놓아 준다.

var PULL_MQ=window.matchMedia('(pointer:coarse),(hover:none)'), RM_MQ=window.matchMedia('(prefers-reduced-motion:reduce)'), PULL_PX=64, PULL_SLOP=10, PULL_MAX=80, PULL_HOLD=48, pull=null, pullHold=false, pullMoved=false, pullClear=0;

function paintPtr(){

    var clr=function(){if(!pull&&!pullHold){pullMoved=false;hd.style.transform=mn.style.transform='';root.classList.remove('pl-t')}};
    if(RM_MQ.matches)clr();else pullClear=setTimeout(clr,240)}

function pullOk(t){

document.addEventListener('touchstart',function(ev){

// 테마: 블로그 ThemeToggle과 같다. dark 클래스를 토글하고 localStorage['theme']에 쓴다. 클래스가 바뀌면 차트를 다시 그린다

// 새로 고침 간격: 반영 대기가 있으면 10초, 없으면 60초. 10초 확인은 반영 대기가 생긴 뒤 최대 10분까지만 하고 그 뒤에는 60초로 돌아간다(대기가 풀리면 다시 센다). 숨은 탭은 확인하지 않는다.
