# 릴리스 산출물 구성. ADR 0042. 태그 푸시가 유일한 계기고
# .github/workflows/release.yml 가 이 설정으로 여섯 플랫폼의 아카이브와
# 체크섬를 GitHub Releases 에 올린다.
version: 2

project_name: engram

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    # CGO_ENABLED=0 은 ADR 0007 의 플랫폼 매트릭스 조건이다.
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    # -trimpath 은 빌드 경로가 바이너리에 박히는 것을 막는다. 개인 기계의
    # 홈 디렉토리 경로가 공개 산출물에 들어가면 안 된다. 공개 경계 문제다.
    flags:
      - -trimpath
    ldflags:
      # internal/cli/version.go 의 version 변수에 태그를 넣는다. 심볼
      # 경로가 틀리면 조용히 dev 로 남으므로 바꿀 때 주의한다.
      - -X github.com/neocode24/engram/internal/cli.version={{ .Version }}

archives:
  - id: engram
    # 이름 규칙은 engram_<version>_<os>_<arch>.<확장자> 다(ADR 0042).
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    # windows 는 zip, 나머지는 tar.gz 다.
    format_overrides:
      - goos: windows
        formats: [zip]
    # 아카이브에 문서와 라이선스를 함께 넣는다.
    files:
      - README.md
      - LICENSE

checksum:
  # 체크섬은 파일 하나에 모은다. Homebrew Formula 가 SHA256 을 요구하고
  # 직접 받는 사용자가 검증할 수단이 된다.
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap 갱신. 지금은 꺼 둔다. 켜는 절차는 아래에 적는다.
#
# 이 저장소가 private 인 동안 Homebrew 는 릴리스 아카이브를 받을 수
# 없으므로 지금 켜면 Formula 가 설치되지 않는 것을 가리킨다(ADR 0042).
# 켜는 시점은 저장소 공개 전환과 한 묶음이다. 순서를 지켜야 Formula 가
# 죽은 링크를 가리키지 않는다.
#
# 켜는 절차.
# 1. 저장소를 public 으로 전환한다.
# 2. tap 저장소에 쓸 수 있는 토큰을 만들어 이 저장소의 시크릿
#    HOMEBREW_TAP_TOKEN 으로 등록한다. 워크플로의 기본 GITHUB_TOKEN 은
#    자기 저장소에만 쓰므로 tap 저장소에는 쓸 수 없다.
# 3. release.yml 의 릴리스 스텝에 HOMEBREW_TAP_TOKEN 환경변수를 더하고
#    아래 brews 절의 주석을 연다.
# 4. 토큰 시크릿이 없는 상태로 tap 갱신을 켜면 릴리스가 절반만 성공하지
#    않도록 실패시킨다(ADR 0042).
#
# brews:
#   - repository:
#       owner: neocode24
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     directory: Formula
#     homepage: https://github.com/neocode24/engram
#     description: 지식관리 위키의 승급 파이프라인을 다루는 CLI
#     install: |
#       bin.install "engram"
