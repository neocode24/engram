# 릴리스 산출물 구성. ADR 0042. 태그 푸시가 유일한 계기고
# .github/workflows/release.yml 가 이 설정으로 여섯 플랫폼의 아카이브와
# 체크섬를 GitHub Releases 에 올린다.
version: 2

project_name: engram

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    # CGO_ENABLED=0 은 ADR 0007 의 플랫폼 매트릭스 조건이다.
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    # -trimpath 은 빌드 경로가 바이너리에 박히는 것을 막는다. 개인 기계의
    # 홈 디렉토리 경로가 공개 산출물에 들어가면 안 된다. 공개 경계 문제다.
    flags:
      - -trimpath
    ldflags:
      # internal/cli/version.go 의 version 변수에 태그를 넣는다. 심볼
      # 경로가 틀리면 조용히 dev 로 남으므로 바꿀 때 주의한다.
      - -X github.com/neocode24/engram/internal/cli.version={{ .Version }}

archives:
  - id: engram
    # 이름 규칙은 engram_<version>_<os>_<arch>.<확장자> 다(ADR 0042).
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    # windows 는 zip, 나머지는 tar.gz 다.
    format_overrides:
      - goos: windows
        formats: [zip]
    # 아카이브에 문서와 라이선스를 함께 넣는다.
    files:
      - README.md
      - LICENSE

checksum:
  # 체크섬은 파일 하나에 모은다. Homebrew Formula 가 SHA256 을 요구하고
  # 직접 받는 사용자가 검증할 수단이 된다.
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap 갱신. neocode24/homebrew-tap 의 Casks/ 에 놓인다.
#
# Formula 가 아니라 Cask 인 이유는 [0088] 에 있다. goreleaser 2.17 에서
# brews 키가 deprecated 라 goreleaser check 가 실패하고, Cask 의 binary
# 아티팩트가 macOS 와 Linux 를 모두 덮는다.
#
# 인증은 tap 저장소의 배포키다. 토큰이 아니다. 배포키는 그 저장소
# 하나에만 쓸 수 있어 권한이 좁고, 같은 계정의 다른 프로젝트가 이미
# 같은 방식을 쓰고 있다. release.yml 이 시크릿을 파일로 쓰고 그 경로를
# 여기로 넘긴다.
homebrew_casks:
  - name: engram
    repository:
      owner: neocode24
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:neocode24/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_DEPLOY_KEY_PATH }}"
    homepage: https://github.com/neocode24/engram
    description: 지식관리 위키의 승급 파이프라인을 강제하는 단일 Go 바이너리
    license: MIT
    commit_author:
      name: engram-release
      email: neocode24@gmail.com
    commit_msg_template: "engram {{ .Tag }}"
    # 코드 서명을 하지 않으므로 Gatekeeper 가 격리 속성을 붙인다.
    # 그대로 두면 첫 실행이 막힌다. 설치 뒤에 그 속성을 지운다.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/engram"]
          end
