# 릴리스 워크플로. v* 태그 푸시가 유일한 계기다(ADR 0042).
# CI 와 파일을 나눈다. 계기와 권한이 다르다. 수동 실행 버튼을 두지
# 않는다. 태그 없는 릴리스가 생기면 version 이 무엇을 가리키는지
# 모호해진다. 태그가 곧 버전이다.
# 태그를 붙이기 전에 CI 가 통과했는지 사람이 확인한다. 이 워크플로가
# 그것을 대신 판단하지 않는다.
name: release

on:
  push:
    tags:
      - "v*"

# 릴리스를 만들려면 contents 쓰기 권한이 필요하다. 최소 권한만 준다.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 태그 전 이력이 필요하다. goreleaser 가 태그와 커밋으로 버전과
      # 변경 이력을 만든다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # go-version-file 로 go.mod 에서 버전을 읽는다. 버전을 박지
          # 않는다. ci.yml 과 같은 방식이다.
          go-version-file: go.mod
      # tap 저장소에 쓸 배포키를 파일로 둔다. goreleaser 가 경로를
      # 받으므로 내용을 직접 넘길 수 없다. 시크릿이 없으면 여기서
      # 멈춘다. 없는 채로 릴리스를 돌리면 아카이브만 올라가고 tap 이
      # 낡은 채로 남아 절반만 성공한 릴리스가 된다(ADR 0042).
      - name: tap 배포키 준비
        env:
          KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "HOMEBREW_DEPLOY_KEY 시크릿이 없습니다" >&2
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/tap_key"
          echo "HOMEBREW_DEPLOY_KEY_PATH=$RUNNER_TEMP/tap_key" >> "$GITHUB_ENV"
      # goreleaser 가 .goreleaser.yaml 대로 여섯 플랫폼을 빌드하고
      # 아카이브와 checksums.txt 를 GitHub Releases 에 올린 뒤
      # neocode24/homebrew-tap 의 Casks/engram.rb 를 갱신한다.
      - name: 릴리스
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_DEPLOY_KEY_PATH: ${{ env.HOMEBREW_DEPLOY_KEY_PATH }}
          # 무엇을 내는지 태그로 못 박는다. 이것이 없으면 goreleaser 가
          # git describe 로 버전을 정하는데, 한 커밋에 태그가 둘 있으면
          # 엉뚱한 쪽을 고른다. 실측으로 v1.0.0 을 밀었더니 같은 커밋의
          # v1.0.0-rc.2 를 릴리스하려 했다.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: tap 배포키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/tap_key"

  voice:
    # engram-voice 는 본체와 배포 방식이 다르다(ADR 0081, 0084).
    # 단일 바이너리가 아니라 바이너리와 lib/ 둘이고, CGO 라 교차 빌드가
    # 안 되므로 goreleaser 한 잡으로 묶을 수 없다. 대상마다 그 플랫폼의
    # 러너에서 voice/scripts/package.sh 를 돌려 아카이브를 만든다.
    #
    # 본체 릴리스가 먼저 끝나야 한다. gh release upload 는 이미 있는
    # 릴리스에 파일을 더하는 것이고 그 릴리스를 goreleaser 가 만든다.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin_arm64 }
          # macos-13 은 2025년 12월에 폐기됐다. Intel 표준 러너는
          # macos-15-intel 이며 2027년 가을에 끝난다(ADR 0086).
          - { os: macos-15-intel, target: darwin_amd64 }
          - { os: ubuntu-latest, target: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: voice/go.mod
      # patchelf 로 모듈 캐시 rpath 를 지운다. 없으면 빌더 경로가 공개
      # 산출물에 남는다. macOS 는 install_name_tool 이 늘 있다.
      - name: patchelf 설치
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: 포장
        shell: bash
        run: voice/scripts/package.sh "${GITHUB_REF_NAME#v}" "$PWD/dist"
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/engram-voice_* --clobber
