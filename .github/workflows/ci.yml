# CI 워크플로. 테스트, 교차 빌드, 문서 검사를 한 파일에서 돈다.
# 릴리스와 배포는 이 범위가 아니다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 네 러너에서 go test 를 돈다. windows-11-arm 은 공개 저장소 전환 시
    # 무료가 되는 GitHub 호스티드 ARM 러너다. 지금은 과금 대상일 수 있다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout 앞에서 끈다. Windows 러너의 기본 autocrlf 가 켜져 있으면
      # harness/fixtures 의 CRLF 픽스처가 소리 없이 바뀌고 골든 비교가
      # 거짓 실패한다. .gitattributes 의 -text 도 있지만 이중 안전망이다.
      - name: git 줄바꿈 변환 끄기
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # go-version-file 로 go.mod 에서 버전을 읽는다. 버전을 박지 않는다.
          go-version-file: go.mod
      - name: 빌드
        run: go build ./...
      - name: 정적 검사
        run: go vet ./...
      - name: 테스트
        run: go test ./...

  cross-build:
    # 교차 빌드만 확인한다. 여섯 조합 전부 CGO_ENABLED=0 이다(ADR 0007).
    # tier 1 은 windows/amd64 와 darwin/arm64 다. 나머지는 best effort 이지만
    # 지금은 전부 성공해야 하므로 특별한 분기를 두지 않는다.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 교차 빌드
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  voice:
    # voice 는 중첩 모듈이라 루트의 ./... 에 잡히지 않는다(ADR 0080).
    # 따로 돌지 않으면 아무 검사도 받지 않는다.
    #
    # CGO 가 켜져 있어 교차 빌드가 안 된다. sherpa-onnx 가 플랫폼마다
    # 다른 모듈로 미리 빌드된 라이브러리를 들고 오기 때문이다. 그래서
    # cross-build 잡처럼 한 러너에서 여섯을 돌 수 없고 대상 OS 의
    # 러너에서 각각 돈다.
    #
    # windows 는 쟀고 통과했다(ADR 0087). 러너의 gcc 15.2.0 으로 빌드가
    # 되고, 모듈의 lib 디렉토리를 PATH 에 넣으면 시험도 돈다.
    #
    # windows/arm64 는 넣지 않는다. sherpa-onnx-go-windows 에 i686 과
    # x86_64 트리플만 있고 arm64 라이브러리가 없다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # 루트가 아니라 voice 의 go.mod 를 읽는다.
          go-version-file: voice/go.mod
      - name: 빌드
        run: go build ./...
      - name: 정적 검사
        run: go vet ./...
      # Windows 는 rpath 가 없어 exe 옆의 DLL 만 본다. go test 가 만드는
      # 임시 실행 파일 옆에는 DLL 이 없어 0xc0000135(DLL_NOT_FOUND) 로
      # 죽는다. 모듈의 lib 디렉토리를 PATH 에 넣어 준다. 배포 아카이브는
      # package.sh 가 DLL 을 exe 옆에 두므로 이 문제가 없다.
      - name: DLL 경로 추가
        if: runner.os == 'Windows'
        run: |
          $dir = go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows
          "$dir\lib\x86_64-pc-windows-gnu" >> $env:GITHUB_PATH
      - name: 테스트
        run: go test ./...
      # 포장까지 CI 에서 돌린다. 릴리스 워크플로는 태그 때만 도는데
      # 거기서 처음 깨지면 본체 릴리스는 이미 성공해 있다. 같은
      # 스크립트를 push 마다 돌려 그 일을 막는다(ADR 0087).
      - name: patchelf 설치
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: 포장
        shell: bash
        working-directory: ${{ github.workspace }}
        run: voice/scripts/package.sh 0.0.0-ci "$RUNNER_TEMP/dist"

  voice-transcribe:
    # 플랫폼마다 실제로 한 번 전사한다. voice 잡의 빌드와 시험이 통과해도
    # 모델을 적재하고 디코딩까지 가는지는 알 수 없다. 시험이 모델 파일을
    # 요구하지 않기 때문이다. darwin/arm64 만 손으로 확인한 상태였다.
    #
    # 표본은 sherpa-onnx 가 화자 분할 예제로 배포하는 실제 사람 녹음이다.
    # 파일 이름에 화자 둘이라고 적혀 있어 그것이 정답이고, 화자 수까지
    # 함께 본다. 전사 언어는 한국어로 박혀 있어(ADR 0079) 영어 오디오의
    # 본문은 뜻이 없다. 여기서 보는 것은 정확도가 아니라 파이프라인이
    # 끝까지 도는가다.
    #
    # 모델은 small 을 쓴다. large-v3 는 1.7GB 라 러너마다 받기 무겁고,
    # 적재와 디코딩 경로는 크기와 무관하게 같다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: voice/go.mod
      # 모델을 캐시한다. 키에 model.go 해시를 넣어 파일 목록이나 체크섬이
      # 바뀌면 캐시가 무효가 되게 한다.
      - uses: actions/cache@v4
        with:
          path: .models
          key: voice-small-${{ runner.os }}-${{ hashFiles('voice/internal/model/model.go') }}
      # 배포 아카이브와 같은 모양으로 만들어 돌린다. go run 이 만드는
      # 임시 실행 파일 옆에는 라이브러리가 없어서, Windows 가 exe 디렉토리
      # 다음으로 System32 를 뒤진다. 거기 있는 낡은 onnxruntime.dll(1.17.1)
      # 이 잡히면 sherpa-onnx 가 요구하는 API 27 이 없어 화자 분할을
      # 만드는 자리에서 0xc0000005 로 죽는다. PATH 를 앞에 넣어도 System32
      # 가 먼저라 소용이 없다. 모듈이 들고 오는 것은 1.27.1 이다.
      #
      # 그래서 exe 옆에 라이브러리를 둔다. package.sh 가 배포에서 하는
      # 것과 같고, 사용자가 실제로 받는 모양이기도 하다.
      - name: 빌드
        shell: bash
        working-directory: voice
        run: |
          go build -o "$RUNNER_TEMP/bin/engram-voice" ./cmd/engram-voice
          if [ "$RUNNER_OS" = "Windows" ]; then
            go mod download github.com/k2-fsa/sherpa-onnx-go-windows
            dir="$(go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows)"
            [ -n "$dir" ] || { echo "모듈 디렉토리를 찾을 수 없습니다" >&2; exit 1; }
            cp "$dir"/lib/x86_64-pc-windows-gnu/*.dll "$RUNNER_TEMP/bin/"
            mv "$RUNNER_TEMP/bin/engram-voice" "$RUNNER_TEMP/bin/engram-voice.exe"
          fi
          ls -l "$RUNNER_TEMP/bin"
      - name: 모델 받기
        shell: bash
        env:
          ENGRAM_MODEL_DIR: ${{ github.workspace }}/.models
        run: |
          "$RUNNER_TEMP/bin/engram-voice" model pull --model small
      - name: 표본 받기
        shell: bash
        run: curl -sSLo "$RUNNER_TEMP/two-speakers.wav" https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/1-two-speakers-en.wav
      - name: 전사
        shell: bash
        env:
          ENGRAM_MODEL_DIR: ${{ github.workspace }}/.models
        run: |
          "$RUNNER_TEMP/bin/engram-voice" transcribe "$RUNNER_TEMP/two-speakers.wav" \
            --model small --json > "$RUNNER_TEMP/out.json"
          cat "$RUNNER_TEMP/out.json"
          # 검사는 node 로 한다. 세 러너 전부에 있고 windows 는 python3 이
          # PATH 에 있다는 보장이 없다.
          node -e '
            const d = require("fs").readFileSync(process.argv[1], "utf8");
            const r = JSON.parse(d);
            if (r.speakers !== 2) throw new Error("화자 수가 2가 아닙니다: " + r.speakers);
            if (!r.lines || !r.lines.length) throw new Error("전사 줄이 비었습니다");
            if (!r.lines.some(l => l.text.trim())) throw new Error("전사 본문이 전부 비었습니다");
            console.log(`화자 ${r.speakers}명, 줄 ${r.lines.length}개`);
          ' "$RUNNER_TEMP/out.json"

  docs:
    # 문서 검사. ADR 색인 정합성과 mermaid 렌더다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ADR 검사
        run: python3 scripts/check-adr.py
      # check-mermaid.py 는 node 와 npx 로 mermaid-cli 를 내려받아 쓴다.
      # mermaid-cli 는 puppeteer 로 브라우저를 띄우는데, 러너에는 샌드박스가
      # 없고 크롬 경로도 다르다. 설정 파일을 만들어 PUPPETEER_CONFIG 로 넘긴다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: mermaid 렌더 준비
        run: |
          CHROME=$(command -v google-chrome || command -v chromium-browser || true)
          if [ -n "$CHROME" ]; then
            printf '{"executablePath":"%s","args":["--no-sandbox","--disable-setuid-sandbox"]}\n' "$CHROME" > /tmp/puppeteer.json
          else
            npx -y puppeteer browsers install chrome
            printf '{"args":["--no-sandbox","--disable-setuid-sandbox"]}\n' > /tmp/puppeteer.json
          fi
          cat /tmp/puppeteer.json
      - name: mermaid 렌더 검사
        env:
          PUPPETEER_CONFIG: /tmp/puppeteer.json
        run: python3 scripts/check-mermaid.py
